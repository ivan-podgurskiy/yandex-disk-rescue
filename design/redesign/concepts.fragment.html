<div id="rescue-directions">
<style>
#rescue-directions{color-scheme:light dark;--paper:light-dark(#f5f6f2,#171c19);--panel:light-dark(#ffffff,#222a25);--ink:light-dark(#203a30,#e1ebe3);--soft:light-dark(#617568,#a2b4a7);--line:light-dark(#dce3db,#3b4b40);--brand:light-dark(#275b43,#a3d7b1);--onbrand:light-dark(#ffffff,#173021);--wash:light-dark(#e9eee6,#303c32);color:var(--ink);font:14px/1.5 system-ui,sans-serif}
#rescue-directions *{box-sizing:border-box}#rescue-directions .stage{min-height:700px;background:var(--paper);position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden}#rescue-directions .chrome{padding:18px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel)}#rescue-directions .logo{font-weight:650;letter-spacing:-.7px;font-size:20px}#rescue-directions .sub{color:var(--soft);font-size:12px}#rescue-directions .grow{flex:1}#rescue-directions button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);padding:9px 14px;border-radius:9px;cursor:pointer}#rescue-directions button:hover{background:var(--wash)}#rescue-directions button.main{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}#rescue-directions button:disabled{opacity:.5;cursor:default}#rescue-directions button.sel{background:var(--wash);border-color:var(--brand)}#rescue-directions h1{font-size:30px;line-height:1.2;letter-spacing:-1px;margin:0 0 12px}#rescue-directions h2{font-size:19px;margin:0 0 12px}#rescue-directions h3{font-size:15px;margin:0 0 10px}#rescue-directions p{margin:8px 0}#rescue-directions .pad{padding:28px}#rescue-directions .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}#rescue-directions .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}#rescue-directions .muted{color:var(--soft)}#rescue-directions .bar{height:7px;border-radius:8px;background:var(--wash);overflow:hidden;margin:16px 0}#rescue-directions .bar i{display:block;height:100%;width:32%;background:var(--brand)}#rescue-directions .big{font-size:48px;letter-spacing:-2px;line-height:1.15}#rescue-directions .list{margin-top:18px}#rescue-directions .file{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}#rescue-directions .file strong{font-weight:550}#rescue-directions .file small{display:block;color:var(--soft)}#rescue-directions .tag{border-radius:6px;background:var(--wash);padding:4px 8px;font-size:12px;white-space:nowrap}#rescue-directions .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}#rescue-directions .center{max-width:620px;margin:0 auto;padding:42px 28px}#rescue-directions .steps{display:flex;gap:8px;margin-bottom:36px}#rescue-directions .steps span{flex:1;border-top:3px solid var(--line);padding-top:9px;color:var(--soft)}#rescue-directions .steps .current{border-color:var(--brand);color:var(--ink)}#rescue-directions input[type=text],#rescue-directions input[type=password],#rescue-directions input[type=search],#rescue-directions select{font:inherit;width:100%;padding:11px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;margin:8px 0 18px}#rescue-directions label.check{display:flex;gap:10px;padding:12px 0}#rescue-directions .rail{display:grid;grid-template-columns:185px 1fr}#rescue-directions .nav{padding:24px 14px;background:var(--panel);border-right:1px solid var(--line)}#rescue-directions .nav button{width:100%;text-align:left;margin-bottom:7px;border-color:transparent}#rescue-directions .bottom{padding:18px 24px;border-top:1px solid var(--line);background:var(--panel);margin-top:22px}#rescue-directions .board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}#rescue-directions .lane{background:var(--wash);border-radius:12px;padding:15px}#rescue-directions .lane .box{margin:12px 0;padding:16px}#rescue-directions .route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin:24px 0}#rescue-directions .bubble{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:14px;max-width:85%;margin:14px 0}#rescue-directions .bubble.user{margin-left:auto;background:var(--wash)}#rescue-directions .overlay{position:absolute;inset:0;background:light-dark(#203a3055,#0008);z-index:5;display:flex;justify-content:flex-end}#rescue-directions .drawer{width:min(440px,100%);padding:26px;background:var(--panel);box-shadow:-10px 0 45px #0002;overflow:auto}#rescue-directions .notice{padding:12px 16px;background:var(--wash);border-radius:8px;margin:14px 0}#rescue-directions .compact{max-width:470px;margin:35px auto}#rescue-directions .ring{width:156px;height:156px;border-radius:50%;background:conic-gradient(var(--brand) 32%,var(--wash) 0);display:grid;place-items:center;margin:24px auto}#rescue-directions .ring>div{width:132px;height:132px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:32px}#rescue-directions [hidden]{display:none!important}@media(max-width:650px){#rescue-directions .stage{min-height:930px}#rescue-directions .rail{grid-template-columns:1fr}#rescue-directions .nav{display:flex;padding:10px;border-right:0;gap:5px;flex-wrap:wrap}#rescue-directions .nav button{width:auto}#rescue-directions .cols,#rescue-directions .board{grid-template-columns:1fr}#rescue-directions .route{grid-template-columns:1fr}#rescue-directions .pad{padding:18px}#rescue-directions .center{padding:28px 18px}#rescue-directions .big{font-size:38px}}
</style>
<div class="viz-carousel" aria-label="Концепции Disk Rescue" data-previous-label="Назад" data-next-label="Далее">
<section data-variant="Пошаговое спасение"><div class="stage" data-app="wizard"></div></section>
<section data-variant="Двухпанельный проводник" hidden><div class="stage" data-app="explorer"></div></section>
<section data-variant="Диспетчер проблем" hidden><div class="stage" data-app="board"></div></section>
<section data-variant="Тихий прибор" hidden><div class="stage" data-app="quiet"></div></section>
<section data-variant="Диалоговый помощник" hidden><div class="stage" data-app="assistant"></div></section>
</div>
<script>
(()=>{
const root=document.getElementById('rescue-directions');
const defaults=()=>({step:0,running:false,started:false,tab:'all',folder:'Фото',drawer:null,previews:true,dest:'/Volumes/Archive/Rescue',connected:true,selected:['Фото','Документы'],resolved:false});
let states=Object.fromEntries(['wizard','explorer','board','quiet','assistant'].map(k=>[k,defaults()]));
function restore(v){if(v&&v.privateContent?.states){for(const k of Object.keys(states))if(v.privateContent.states[k])Object.assign(states[k],v.privateContent.states[k]);}}
restore(window.openai?.widgetState);
function save(){window.openai?.setWidgetState?.({modelContent:{concepts:['Пошаговое спасение','Двухпанельный проводник','Диспетчер проблем','Тихий прибор','Диалоговый помощник']},privateContent:{states}})?.catch(()=>{});}
const btn=(t,a,main=false)=>`<button type="button" data-act="${a}" class="${main?'main':''}">${t}</button>`;
function chrome(extra=''){return `<div class="chrome"><span class="logo">↗ diskrescue</span><span class="sub">Демонстрационные данные</span><span class="grow"></span>${extra}</div>`;}
function toggle(s){return btn(s.running?'Ⅱ Приостановить':s.started?'▶ Продолжить':'▶ Начать восстановление','toggle',true);}
function status(s){return s.running?'Сохраняем доступные файлы':s.started?'На паузе · активных записей нет':'Готово к запуску';}
const folders=['Фото','Документы','Видео'];
function files(s){const data=s.folder==='Документы'?[['Договор.pdf','4 МБ','Оригинал сохранён'],['Архив.zip','128 МБ','В очереди']]:s.folder==='Видео'?[['Семейный фильм.mp4','1,4 ГБ','Ожидает повтора']]:[['Стамбул.jpg','12 МБ','Оригинал сохранён'],['Лето.jpg','8 МБ','Есть превью'],['Море.jpg','14 МБ','Ожидает повтора'],['Поездка.jpg','9 МБ','Оригинал сохранён']];return data.filter(r=>s.tab!=='attention'||r[2]==='Ожидает повтора').map((r,i)=>`<div class="file"><span>▧</span><div class="grow"><strong>${r[0]}</strong><small>${r[1]}</small></div><span class="tag">${r[2]}</span>${btn('Открыть','file:'+i)}</div>`).join('')||'<p class="muted">Здесь нет файлов, требующих внимания.</p>';}
function settings(s){return `<h2>Настройки восстановления</h2><h3>Подключение</h3><p>${s.connected?'✓ Яндекс.Диск подключён':'Требуется подключение'}</p>${btn(s.connected?'Изменить токен':'Подключить','connect')}<hr><label>Место сохранения<input type="text" data-field="dest" value="${s.dest.replaceAll('&','&amp;').replaceAll('"','&quot;')}"></label><label class="check"><input type="checkbox" data-field="previews" ${s.previews?'checked':''}>Сохранять превью отдельно</label><details><summary>Параметры сети</summary><label>Одновременные загрузки<select><option>4 передачи</option><option>2 передачи</option><option>8 передач</option></select></label><label>Тайм-аут<select><option>12 секунд</option><option>30 секунд</option></select></label></details><p class="muted">Смена назначения создаёт отдельную копию. Готовые файлы остаются на прежнем месте.</p>${btn('Сохранить и закрыть','close',true)}`;}
function selection(s){return `<h2>Что восстановить</h2><p class="muted">Выберите весь Диск или отдельные папки.</p>${btn('Выбрать всё','all')}${folders.map(f=>`<label class="check"><input type="checkbox" data-folder="${f}" ${s.selected.includes(f)?'checked':''}>${f}<span class="grow"></span><span class="muted">${f==='Фото'?'286':f==='Документы'?'24':'90'} ГБ</span></label>`).join('')}<div class="notice">Выбрано: ${s.selected.join(', ')||'ничего'}</div>${btn('Применить выбор','close',true)}`;}
function overlay(s){if(!s.drawer)return '';let content=s.drawer==='settings'?settings(s):s.drawer==='select'?selection(s):s.drawer==='connect'?`<h2>Подключение Яндекс.Диска</h2><label>OAuth-токен<input type="password" placeholder="Демонстрационный токен"></label><label class="check"><input type="checkbox" checked>Запомнить на этом компьютере</label>${btn('Проверить подключение','connected',true)}`:s.drawer==='file'?`<h2>Стамбул.jpg</h2><div class="box" style="padding:55px 20px;text-align:center;background:var(--wash)">▧<p>Предпросмотр файла</p></div><p>Фото / Путешествия / Стамбул.jpg</p><p>Оригинал сохранён · MD5 проверен</p><p class="muted">${s.dest}/Фото/Путешествия/Стамбул.jpg</p>`:s.drawer==='results'?`<h2>Сохранённые файлы</h2>${files(s)}`:`<h2>Почему файл недоступен</h2><p>Яндекс.Диск временно не отдаёт оригинал «Море.jpg».</p><p>Превью уже сохранено. Повтор можно выполнить позже.</p>${btn(s.resolved?'Повтор запланирован':'Запланировать повтор','retry',true)}`;return `<div class="overlay"><div class="drawer" role="dialog" aria-label="Панель восстановления"><div class="row" style="margin-bottom:24px"><span class="grow"></span>${btn('Закрыть ×','close')}</div>${content}</div></div>`;}
function wizard(s){let body='';if(s.step===0)body=`<h1>Сначала подключим Диск</h1><p class="muted">Доступ нужен для чтения каталога и скачивания файлов.</p><div class="box" style="margin:28px 0"><p>✓ Яндекс.Диск подключён</p><p class="muted">Токен сохранён на этом компьютере.</p>${btn('Изменить подключение','connect')}</div>${btn('Далее: место сохранения','next',true)}`;else if(s.step===1)body=`<h1>Куда сохранить файлы?</h1><label>Папка на накопителе<input type="text" data-field="dest" value="${s.dest.replaceAll('"','&quot;')}"></label><p>✓ Накопитель доступен · свободно 1,2 ТБ</p><label class="check"><input type="checkbox" data-field="previews" ${s.previews?'checked':''}>Сохранять доступные превью</label><div class="row">${btn('Назад','back')}${btn('Далее: выбор файлов','next',true)}</div>`;else if(s.step===2)body=selection(s).replace('data-act="close"','data-act="launch"').replace('Применить выбор','Начать восстановление');else body=`<p class="muted">${s.selected.join(', ')} → ${s.dest}</p><h1>${status(s)}</h1><div class="big">32%</div><div class="bar"><i></i></div><p>128 из 400 ГБ оригиналов сохранено</p><p class="muted">${s.running?'4 передачи · 12 МБ/с':'Очередь сохранена'}</p><div class="row" style="margin-top:24px">${toggle(s)}${btn('Посмотреть файлы','results')}</div><div class="notice">18 файлов ждут повтора. Превью учитываются отдельно.</div>${btn('Изменить параметры','settings')}`;return chrome()+`<div class="center"><div class="steps">${['Подключить','Куда','Что','Спасение'].map((t,i)=>`<span class="${i===s.step?'current':''}">${t}</span>`).join('')}</div>${body}</div>`;}
function explorer(s){return chrome(btn('Настройки','settings'))+`<div class="pad"><div class="row"><h2 class="grow">Яндекс.Диск <span class="muted">→ Archive</span></h2>${btn('Выбрать содержимое','select')}</div><div class="rail box" style="padding:0;margin-top:16px"><nav class="nav" aria-label="Папки">${folders.map(f=>`<button data-act="folder:${f}" class="${s.folder===f?'sel':''}">▱ ${f}</button>`).join('')}</nav><div class="pad"><div class="row"><h2 class="grow">${s.folder}</h2>${btn(s.tab==='attention'?'Все файлы':'Требуют внимания','filter')}</div><input type="search" placeholder="Поиск в папке" data-search>${files(s)}</div></div></div><div class="bottom"><div class="row"><div class="grow"><strong>${status(s)}</strong><div class="sub">128 / 400 ГБ · 32% ${s.running?'· 12 МБ/с':''}</div></div>${toggle(s)}</div><div class="bar"><i></i></div><span class="sub">${s.dest} · 1,2 ТБ свободно</span></div>`;}
function board(s){return chrome(btn('Параметры','settings'))+`<div class="pad"><div class="row"><div class="grow"><h1>Спасение под контролем</h1><p class="muted">Фото, Документы → Archive</p></div>${toggle(s)}</div><div class="bar"><i></i></div><div class="row" style="margin-bottom:25px"><span>128 / 400 ГБ сохранено</span><span class="grow"></span>${btn('Изменить состав','select')}</div><div class="board"><section class="lane"><h3>Сохранено · 8 240</h3><div class="box"><strong>Оригиналы проверены</strong><p class="muted">128 ГБ · полные копии файлов</p>${btn('Открыть результаты','results')}</div><div class="box"><strong>Есть только превью</strong><p class="muted">420 фотографий</p>${btn('Посмотреть пример','file')}</div></section><section class="lane"><h3>В работе · 12 184</h3><div class="box"><strong>${s.running?'4 файла скачиваются':'Загрузка на паузе'}</strong><p class="muted">${s.running?'Следом — остальные доступные файлы':'Продолжите, когда будет удобно'}</p></div><div class="box"><strong>Автоматические повторы</strong><p class="muted">Недоступные файлы будут проверены позже.</p></div></section><section class="lane"><h3>Нужно внимание · ${s.resolved?'17':'18'}</h3><div class="box"><strong>Море.jpg</strong><p class="muted">Оригинал временно недоступен</p>${btn('Разобраться','issue')}</div><div class="box"><strong>Семейный фильм.mp4</strong><p class="muted">Сервер не ответил вовремя</p>${btn('Повторить позже','retry')}</div></section></div>${s.resolved?'<div class="notice" role="status">Повтор запланирован. Остальное восстановление продолжается по текущему плану.</div>':''}</div>`;}
function quiet(s){return chrome(btn('Настройки','settings'))+`<div class="compact"><div class="box" style="text-align:center"><p class="muted">Яндекс.Диск → Archive</p><h1>${s.running?'Ваш архив сохраняется':s.started?'Можно сделать перерыв':'Готовы сохранить архив'}</h1><div class="ring"><div>32%</div></div><p>128 из 400 ГБ</p><p class="muted">${s.running?'4 передачи · 12 МБ/с':'Активных записей нет'}</p><div style="margin:25px 0">${toggle(s)}</div><div class="row" style="justify-content:center">${btn('Результаты','results')}${btn('Что сохраняем','select')}</div></div><details style="margin:20px 0"><summary>Состояние и подробности</summary><div class="list"><p>✓ Подключение активно</p><p>✓ Накопитель доступен · 1,2 ТБ свободно</p><p>Превью: 420 · ждут повтора: 18</p><p class="muted">${s.dest}</p></div></details><p class="sub" style="text-align:center">${s.running?'Закрытие вкладки не останавливает загрузку.':'Очередь сохранена. Можно продолжить позже.'}</p></div>`;}
function assistant(s){return chrome(btn('Параметры','settings'))+`<div class="rail"><nav class="nav"><h3>Текущее спасение</h3><p class="sub">Фото, Документы</p><p>Archive</p><div class="bar"><i></i></div><p>128 / 400 ГБ</p>${btn('Результаты','results')}${btn('Выбор файлов','select')}</nav><div class="pad"><h2>Сохраним ваш архив</h2><div class="bubble">Яндекс.Диск подключён. На Archive достаточно места. Что будем сохранять?<div class="row" style="margin-top:12px">${btn('Весь Диск','chooseall')}${btn('Выбрать папки','select')}</div></div><div class="bubble user">${s.selected.join(', ')||'Ничего не выбрано'}. ${s.previews?'С превью.':'Только оригиналы.'}</div><div class="bubble">${s.started?`Сохранено 128 ГБ. ${s.running?'Продолжаю скачивать доступные файлы.':'Загрузка приостановлена.'}`:'План готов: оригиналы в выбранную папку, превью отдельно.'}<p class="muted">${s.dest}</p><div class="bar"><i></i></div>${toggle(s)}</div><div class="bubble">У 18 файлов оригинал пока недоступен. Для части фотографий сохранены превью.<div class="row" style="margin-top:12px">${btn('Показать проблему','issue')}${btn('Показать сохранённое','results')}</div></div><p class="sub">Действия через подсказки · без свободного ввода</p></div></div>`;}
const renders={wizard,explorer,board,quiet,assistant};
function render(k){const el=root.querySelector(`[data-app="${k}"]`);el.innerHTML=renders[k](states[k])+overlay(states[k]);}
Object.keys(states).forEach(render);
root.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;const app=b.closest('[data-app]');const k=app.dataset.app,s=states[k],a=b.dataset.act;
if(a==='toggle'){if(!s.selected.length){s.drawer='select';}else{s.running=!s.running;s.started=true;}}
else if(a==='next')s.step=Math.min(3,s.step+1);else if(a==='back')s.step=Math.max(0,s.step-1);
else if(a==='launch'){if(!s.selected.length)return;s.step=3;s.started=true;s.running=true;}
else if(a==='close')s.drawer=null;else if(a==='connected'){s.connected=true;s.drawer='settings';}
else if(a==='all')s.selected=[...folders];else if(a==='chooseall'){s.selected=[...folders];}
else if(a==='filter')s.tab=s.tab==='all'?'attention':'all';else if(a.startsWith('folder:'))s.folder=a.slice(7);
else if(a==='retry'){s.resolved=true;}
else if(a.startsWith('file'))s.drawer='file';else s.drawer=a;
render(k);save();});
root.addEventListener('change',e=>{const el=e.target,k=el.closest('[data-app]')?.dataset.app;if(!k)return;const s=states[k];if(el.dataset.folder){const f=el.dataset.folder;s.selected=el.checked?[...new Set([...s.selected,f])]:s.selected.filter(x=>x!==f);}else if(el.dataset.field)s[el.dataset.field]=el.type==='checkbox'?el.checked:el.value;render(k);save();});
root.addEventListener('input',e=>{if(!e.target.matches('[data-search]'))return;const q=e.target.value.toLowerCase();e.target.parentElement.querySelectorAll('.file').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q));});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);Object.keys(states).forEach(render);}});
if(globalThis.Tweak){const design={dense:false};const t=new Tweak({container:root,onChange:()=>{root.querySelectorAll('.file').forEach(x=>x.style.padding=design.dense?'8px 0':'13px 0');}});t.addToggle(design,'dense',{label:'Компактные строки файлов'});}
})();
</script>
</div>
